name: Supabase 24/7 Keep-Alive & Health Ping

on:
  schedule:
    # Berjalan otomatis setiap 3 hari pada pukul 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions GitHub

jobs:
  ping-supabase:
    name: Ping Supabase REST Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Perform Health Ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "[INFO] Memulai proses Supabase Keep-Alive Health Ping..."
          
          # Validasi Pre-flight: Pastikan GitHub Repository Secrets telah dikonfigurasi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "[ERROR] Variabel rahasia SUPABASE_URL atau SUPABASE_ANON_KEY belum dikonfigurasi di GitHub Secrets."
            echo ""
            echo "Panduan Konfigurasi Repository Secrets:"
            echo "1. Buka Repositori GitHub -> Settings -> Secrets and variables -> Actions."
            echo "2. Klik 'New repository secret' dan tambahkan:"
            echo "   - Nama: SUPABASE_URL"
            echo "   - Nama: SUPABASE_ANON_KEY"
            echo "Nilai kredensial dapat diambil dari dashboard Supabase Project API Settings."
            exit 1
          fi

          # Normalisasi URL: Hapus trailing slash jika ada
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "[INFO] Mengirimkan request keep-alive ke instance Supabase PostgREST..."
          
          # Kirim request dengan timeout dan retry
          HTTP_STATUS=$(curl -sS --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 2 \
            -o /tmp/supabase_response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/media_checklists?select=id&limit=1" || echo "CURL_FAILED")
          
          echo "[INFO] Kode Respons Supabase: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "206" ]; then
            echo "[SUKSES] Database Supabase aktif, responsif, dan sehat. Fitur auto-pause berhasil dicegah."
            exit 0
          else
            echo "[ERROR] Status HTTP tidak diharapkan: $HTTP_STATUS."
            if [ -f /tmp/supabase_response.json ]; then
              echo "[INFO] Cuplikan respons payload:"
              head -c 300 /tmp/supabase_response.json
              echo ""
            fi
            echo "[SARAN] Mohon verifikasi kembali nilai SUPABASE_URL dan SUPABASE_ANON_KEY pada GitHub Secrets."
            exit 1
          fi
